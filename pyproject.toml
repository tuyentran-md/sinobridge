[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sinobridge"
version = "0.2.0"
description = "Source-traceable Chinese-to-Vietnamese reading, translation and research toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Tuyen Tran"}]
dependencies = []

[project.optional-dependencies]
pdf = ["pymupdf>=1.24"]
docx = ["python-docx>=1.1"]
all = ["pymupdf>=1.24", "python-docx>=1.1", "certifi"]
dev = ["pytest>=8"]

[project.scripts]
sinobridge = "sinobridge.cli:main"
sino = "sinobridge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sinobridge = ["data/*.tsv", "data/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
