name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e '.[docx]'
      - name: Unit tests
        run: python -m unittest discover -s tests -v

  epubcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Build sample EPUBs from synthetic text
        run: |
          pip install -e .
          hanviet ingest examples/synthetic_zh.md --workspace /tmp/ws --kind paper
          python - <<'PY'
          import json, pathlib
          p = pathlib.Path("/tmp/ws/segments.jsonl")
          segs = [json.loads(l) for l in p.read_text().splitlines()]
          for s in segs:
              s["translation"], s["status"] = "Bản dịch mẫu " + s["source"].lstrip("# ")[:20], "DRAFT"
          p.write_text("".join(json.dumps(s, ensure_ascii=False) + "\n" for s in segs))
          PY
          hanviet export --workspace /tmp/ws --format epub --out /tmp/vi.epub
          hanviet export --workspace /tmp/ws --format epub --bilingual --out /tmp/bi.epub
      - name: EPUBCheck
        run: |
          curl -sSL -o epubcheck.zip https://github.com/w3c/epubcheck/releases/download/v5.1.0/epubcheck-5.1.0.zip
          unzip -q epubcheck.zip
          java -jar epubcheck-5.1.0/epubcheck.jar /tmp/vi.epub
          java -jar epubcheck-5.1.0/epubcheck.jar /tmp/bi.epub
